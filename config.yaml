# Dataset generation config

NUM_SCENES: 1000          # total scenes to generate
OBJECTS_PER_SCENE: 4      # objects on the table (excl. distractors)
DISTRACTORS_PER_SCENE: 2  # extra distractor objects
IMAGE_WIDTH: 640
IMAGE_HEIGHT: 480
OUTPUT_DIR: "output"

# Camera params
CAMERA_DISTANCE: 1.2
CAMERA_PITCH: -40         # degrees
CAMERA_YAW_RANGE: [0, 360]

# Table bounds (x, y)
TABLE_X_RANGE: [-0.3, 0.3]
TABLE_Y_RANGE: [-0.3, 0.3]
TABLE_HEIGHT: 0.625

# Relation types to sample
RELATION_TYPES:
  - left_of
  - right_of
  - in_front_of
  - behind
  - nearest_to
  - farthest_from
  - between

# Object categories (maps to URDF primitives)
OBJECT_CATEGORIES:
  - name: cube
    size: [0.04, 0.04, 0.04]
    colors:
      - [1.0, 0.0, 0.0, 1.0]   # red
      - [0.0, 0.0, 1.0, 1.0]   # blue
      - [0.0, 1.0, 0.0, 1.0]   # green
      - [1.0, 1.0, 0.0, 1.0]   # yellow
  - name: cylinder
    size: [0.025, 0.025, 0.06]
    colors:
      - [1.0, 0.5, 0.0, 1.0]   # orange
      - [0.5, 0.0, 0.5, 1.0]   # purple
  - name: sphere
    size: [0.03, 0.03, 0.03]
    colors:
      - [0.0, 1.0, 1.0, 1.0]   # cyan
      - [1.0, 0.0, 1.0, 1.0]   # magenta
